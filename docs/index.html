<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1EE;
    --surface:#FFFFFF;
    --ink:#121B17;
    --ink-muted:#5C6B64;
    --ink-faint:#93A099;
    --line:#D9DED8;
    --accent:#1F6F5C;
    --accent-soft:#DCEAE3;
    --danger:#B3432B;
    --danger-soft:#F5E1DA;
    --amber:#A9791C;
    --amber-soft:#F3E7CE;
    --blue:#2A5FA5;
    --blue-soft:#DCE7F5;
    --indigo:#5B4B8A;
    --indigo-soft:#E6E1F2;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num, .kpi-value, .delta, th.num-h{
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing:-0.02em;
  }
  a{color:var(--accent);}
  button{font-family:inherit; cursor:pointer;}
  svg.icon{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  .shell{max-width:1220px; margin:0 auto; padding:28px 24px 60px;}

  .topbar{
    display:flex; justify-content:space-between; align-items:flex-end;
    padding-bottom:18px; margin-bottom:22px; border-bottom:2px solid var(--ink);
  }
  .topbar h1{font-size:22px; font-weight:700; margin:0; letter-spacing:-0.01em;}
  .topbar .sub{font-size:12px; color:var(--ink-muted); margin-top:4px; font-family:'IBM Plex Mono', monospace;}
  .topbar .meta{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-muted); font-family:'IBM Plex Mono', monospace;}
  .topbar .meta b{color:var(--ink); font-weight:600;}
  #refreshBtn{
    display:flex; align-items:center; justify-content:center; width:30px; height:30px;
    border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-muted);
  }
  #refreshBtn:hover{color:var(--accent); border-color:var(--accent);}
  #refreshBtn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .controls{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
  .seg{display:inline-flex; border:1px solid var(--ink); border-radius:var(--radius); overflow:hidden;}
  .seg button{
    border:none; background:var(--surface); color:var(--ink-muted); font-family:'IBM Plex Mono',monospace;
    font-size:12px; padding:8px 16px; border-right:1px solid var(--ink);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--ink); color:var(--surface);}

  #periodValue{
    border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); color:var(--ink);
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:8px 12px;
  }

  .tabs{display:flex; gap:2px; flex-wrap:wrap;}
  .tabs button{
    border:none; background:transparent; color:var(--ink-muted); font-family:'Space Grotesk',sans-serif;
    font-weight:500; font-size:13px; padding:9px 14px; border-radius:var(--radius);
    border-bottom:2px solid transparent;
  }
  .tabs button.active{color:var(--ink); border-bottom:2px solid var(--accent); background:var(--accent-soft);}

  .kpi-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:26px;}
  .kpi{background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--ink-faint); border-radius:var(--radius); padding:16px;}
  .kpi.up{border-top-color:var(--accent);}
  .kpi.down{border-top-color:var(--danger);}
  .kpi-head{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .kpi-icon{
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .kpi-label{font-size:11.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.04em; margin:0;}
  .kpi-value{font-size:22px; font-weight:600; margin:0; color:var(--ink);}
  .delta{font-size:11px; margin-top:6px; display:flex; align-items:center; gap:4px;}
  .delta.up{color:var(--accent);}
  .delta.down{color:var(--danger);}
  .delta .prev{color:var(--ink-faint); font-size:10px;}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:20px;}
  .panel-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line);}
  .panel-head h2{font-size:13px; font-weight:600; margin:0; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-muted);}
  .legend{display:flex; gap:14px; font-size:11px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:2px; display:inline-block;}

  .chart-wrap{padding:14px 16px 8px; height:220px; position:relative;}
  .charts-row{display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .charts-row .panel{margin-bottom:0; min-width:280px;}
  @media (max-width:900px){ .charts-row{flex-direction:column;} }

  .insights{display:flex; gap:0; flex-wrap:wrap;}
  .insight{flex:1; min-width:220px; display:flex; align-items:center; gap:12px; padding:16px; border-right:1px solid var(--line);}
  .insight:last-child{border-right:none;}
  .insight-icon{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .insight-label{font-size:11px; color:var(--ink-muted); margin:0 0 3px;}
  .insight-value{font-size:14px; font-weight:600; margin:0; font-family:'IBM Plex Mono',monospace;}
  .insights-empty{padding:16px; font-size:12.5px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  thead th{
    text-align:left; padding:9px 14px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em;
    color:var(--ink-muted); font-weight:600; border-bottom:1px solid var(--ink); font-family:'Space Grotesk',sans-serif;
  }
  thead th.num-h{text-align:right;}
  tbody td{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody td.num{text-align:right;}
  tbody tr:hover{background:#F7F9F7;}
  .offer-tag{
    display:inline-block; font-size:10.5px; font-family:'IBM Plex Mono',monospace; padding:1px 7px;
    border-radius:4px; background:var(--indigo-soft); color:var(--indigo); font-weight:500; margin-left:6px;
  }
  .muted-cell{color:var(--ink-faint);}
  .foot-note{font-size:11.5px; color:var(--ink-muted); padding:12px 16px; border-top:1px solid var(--line); font-family:'IBM Plex Mono',monospace;}
  .foot-note a{color:var(--accent); text-decoration:none;}
  .empty-note{padding:16px; font-size:12.5px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace;}

  @media (max-width:1000px){
    .kpi-grid{grid-template-columns:repeat(3,1fr);}
    .insight{border-right:none; border-bottom:1px solid var(--line);}
  }
  @media (max-width:560px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .topbar{flex-direction:column; align-items:flex-start; gap:8px;}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div>
      <h1>Affiliate Ledger</h1>
      <div class="sub">Источники: Alanbase API · Google Sheets (Spend)</div>
    </div>
    <div class="meta">
      <span>Обновлено <b id="updatedAt">—</b></span>
      <button id="refreshBtn" title="Обновить данные" aria-label="Обновить данные">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>
  </div>

  <div id="statusBanner" style="display:none; background:var(--amber-soft); color:var(--amber); border:1px solid var(--amber); border-radius:var(--radius); padding:10px 14px; font-size:12.5px; font-family:'IBM Plex Mono',monospace; margin-bottom:16px;"></div>

  <div class="controls">
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <div class="seg" id="periodSeg">
        <button data-period="week" class="active">Неделя</button>
        <button data-period="month">Месяц</button>
      </div>
      <select id="periodValue"></select>
    </div>
    <div class="tabs" id="groupTabs"></div>
  </div>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="charts-row">
    <div class="panel" id="regFtdChartPanel" style="flex:1;">
      <div class="panel-head">
        <h2 id="regFtdChartTitle">Регистрации и FTD</h2>
      </div>
      <div class="chart-wrap" style="height:260px;">
        <canvas id="regFtdChart" role="img" aria-label="Столбчатый график: Registrations и FTD за выбранный период по сравнению с предыдущим"></canvas>
      </div>
    </div>
    <div class="panel" id="spendGgrChartPanel" style="flex:1;">
      <div class="panel-head">
        <h2 id="spendGgrChartTitle">Spend и GGR</h2>
      </div>
      <div class="chart-wrap" style="height:260px; display:flex; gap:12px;">
        <div style="flex:1; position:relative;"><canvas id="spendChart" role="img" aria-label="Столбчатый график Spend за выбранный период по сравнению с предыдущим"></canvas></div>
        <div style="flex:1; position:relative;"><canvas id="ggrChart" role="img" aria-label="Столбчатый график GGR за выбранный период по сравнению с предыдущим"></canvas></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Ключевые инсайты</h2>
      <span style="font-size:11px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace;">по дням сбора, не по выбранному периоду</span>
    </div>
    <div class="insights" id="insightsRow"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2 id="tableTitle">Партнёры</h2>
      <span id="tableHint" style="font-size:11px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace;"></span>
    </div>
    <div style="overflow-x:auto;">
      <table id="dataTable"></table>
    </div>
    <div class="foot-note">Spend подтягивается из <a href="#" onclick="return false;">Google Sheets</a> по partner_id. CPA рассчитывается автоматически: CPA FTD = Spend / FTD.</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/* ---------------------------------------------------------------
   ЖИВЫЕ ДАННЫЕ
   Читаем ./data/latest.json (снимок недели по группам + список строк
   по партнёрам/офферам) и ./data/history.json (накопленная история).
   Оба файла обновляет scripts/collect.py по расписанию GitHub Actions.
------------------------------------------------------------------*/

const ICONS = {
  people: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  card: '<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
  dollar: '<circle cx="12" cy="12" r="10"/><path d="M12 6v12M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1.1-3 2.5 1.3 2 3 2.5 3 1.1 3 2.5-1.3 2.5-3 2.5-3-1.1-3-2.5"/>',
  bank: '<line x1="3" y1="21" x2="21" y2="21"/><line x1="5" y1="21" x2="5" y2="10"/><line x1="19" y1="21" x2="19" y2="10"/><polygon points="12 2 21 8 3 8"/>',
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  calc: '<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11.01"/><line x1="12" y1="11" x2="12" y2="11.01"/><line x1="16" y1="11" x2="16" y2="11.01"/><line x1="8" y1="15" x2="8" y2="15.01"/><line x1="12" y1="15" x2="12" y2="15.01"/><line x1="16" y1="15" x2="16" y2="15.01"/>',
  trendUp: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
  trendDown: '<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>',
  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
};
function svgIcon(name){ return `<svg class="icon" viewBox="0 0 24 24">${ICONS[name]}</svg>`; }

const GROUP_META = {
  partners: { title:'Партнёры', hasDashboard:true },
  seo:      { title:'СЕО',       hasDashboard:true },
  inhouse:  { title:'Инхаус',    hasDashboard:true },
  cc:       { title:'CC / Баннеры', hasDashboard:true },
  inactive: { title:'Неактивные', hasDashboard:false },
};

let WEEKS = null;
let LATEST = null;
let HISTORY = null;
let state = { periodType:'week', selectedKey:null, group:'partners' };
let chartRef = null;

function fmtInt(n){ return Math.round(n||0).toLocaleString('ru-RU'); }
function fmtMoney(n){ return '$'+Math.round(n||0).toLocaleString('ru-RU'); }
function fmtPct(n){ return (n||0).toFixed(1)+'%'; }
function fmtDateShort(iso){ if(!iso) return ''; const d = iso.split(' ')[0]; return d.slice(8,10)+'.'+d.slice(5,7); }

function delta(cur, prev){
  if(prev === undefined || prev === null) return null;
  const abs = cur-prev;
  const pct = prev !== 0 ? (abs/prev*100) : (cur>0?100:0);
  return {abs, pct};
}

function computeDerived(m){
  if(!m) return {registrations:0, ftd:0, ggr:0, ngr:0, spend:null, crFtd:0, cpaFtd:null};
  const crFtd = m.registrations ? (m.ftd/m.registrations*100) : 0;
  const hasSpend = m.spend !== null && m.spend !== undefined;
  const cpaFtd = (hasSpend && m.ftd) ? (m.spend/m.ftd) : null;
  return {...m, spend: hasSpend ? m.spend : null, crFtd, cpaFtd};
}

function round2(n){ return Math.round((n||0)*100)/100; }

function weekKeysSorted(){ return (LATEST.available_weeks||[]).slice().sort().reverse(); }

function monthBuckets(){
  // buckets[0] = 4 самые свежие недели ("этот месяц"), buckets[1] = следующие 4 ("прошлый месяц")
  const weeks = weekKeysSorted();
  const buckets = [];
  for(let i=0; i+4<=weeks.length; i+=4) buckets.push(weeks.slice(i, i+4));
  return buckets;
}

function sumGroupSnapshots(weekKeys, group){
  let reg=0, ftd=0, ggr=0, spend=0, spendKnown=true;
  const rowsMap = {};
  weekKeys.forEach(wk=>{
    const snap = WEEKS[wk] && WEEKS[wk][group];
    if(!snap) return;
    reg += snap.registrations||0;
    ftd += snap.ftd||0;
    ggr += snap.ggr||0;
    if(snap.spend===null || snap.spend===undefined) spendKnown=false; else spend += snap.spend;
    (snap.rows||[]).forEach(r=>{
      const key = r.offer_id ? (r.partner_id+'|'+r.offer_id) : r.partner_id;
      if(!rowsMap[key]) rowsMap[key] = {partner_id:r.partner_id, partner_name:r.partner_name, offer_id:r.offer_id, offer_name:r.offer_name, registrations:0, ftd:0, ggr:0, spend:null};
      rowsMap[key].registrations += r.registrations||0;
      rowsMap[key].ftd += r.ftd||0;
      rowsMap[key].ggr += r.ggr||0;
      if(r.spend!=null){ rowsMap[key].spend = (rowsMap[key].spend||0) + r.spend; }
    });
  });
  const rows = Object.values(rowsMap).map(r=>({
    ...r, ggr: round2(r.ggr), ngr: round2(r.ggr*0.6),
    cr_ftd: r.registrations ? round2(r.ftd/r.registrations*100) : 0,
    cpa_ftd: (r.spend!=null && r.ftd) ? round2(r.spend/r.ftd) : null,
  })).sort((a,b)=>b.registrations-a.registrations);
  return { registrations:reg, ftd, ggr:round2(ggr), ngr:round2(ggr*0.6), spend: spendKnown?round2(spend):null, rows };
}

function monthSnapshot(bucketIndex){
  const buckets = monthBuckets();
  const weekKeys = buckets[bucketIndex];
  if(!weekKeys) return null;
  const result = {};
  Object.keys(GROUP_META).forEach(g=>{ result[g] = sumGroupSnapshots(weekKeys, g); });
  result._period = { from: WEEKS[weekKeys[weekKeys.length-1]]._period.from, to: WEEKS[weekKeys[0]]._period.to };
  return result;
}

function getSnapshot(key){
  if(key === null || key === undefined) return null;
  return state.periodType === 'week' ? WEEKS[key] : monthSnapshot(parseInt(key, 10));
}

function availableKeys(){
  if(state.periodType === 'week') return weekKeysSorted();
  return monthBuckets().map((_,i)=>String(i));
}

function periodLabel(key, index){
  if(state.periodType === 'week'){
    const names = ['Эта неделя','Прошлая неделя','2 недели назад','3 недели назад','4 недели назад','5 недель назад','6 недель назад','7 недель назад'];
    const snap = WEEKS[key];
    const range = snap && snap._period ? `${fmtDateShort(snap._period.from)}–${fmtDateShort(snap._period.to)}` : key;
    return `${names[index] || key} (${range})`;
  } else {
    const names = ['Этот месяц (последние 4 недели)','Прошлый месяц (недели 5–8 назад)'];
    const snap = monthSnapshot(index);
    const range = snap && snap._period ? `${fmtDateShort(snap._period.from)}–${fmtDateShort(snap._period.to)}` : '';
    return `${names[index] || key} (${range})`;
  }
}

async function loadData(showSpinner){
  const banner = document.getElementById('statusBanner');
  const btn = document.getElementById('refreshBtn');
  if(showSpinner) btn.classList.add('spinning');
  try{
    const [latestRes, weeksRes, historyRes] = await Promise.all([
      fetch('./data/latest.json', {cache:'no-store'}),
      fetch('./data/weeks.json', {cache:'no-store'}),
      fetch('./data/history.json', {cache:'no-store'}),
    ]);
    if(!latestRes.ok) throw new Error('latest.json недоступен (' + latestRes.status + ')');
    LATEST = await latestRes.json();
    WEEKS = weeksRes.ok ? await weeksRes.json() : {};
    HISTORY = historyRes.ok ? await historyRes.json() : {};

    const generated = new Date(LATEST.generated_at);
    document.getElementById('updatedAt').textContent = generated.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});

    const ageHours = (Date.now() - generated.getTime()) / 3600000;
    const staleGroups = LATEST.spend_stale_warnings || {};
    const staleNames = Object.keys(staleGroups).map(g => (GROUP_META[g]||{title:g}).title);

    if(ageHours > 30){
      banner.style.display = '';
      banner.textContent = `Данные собирались ${Math.round(ageHours)} ч назад — проверь, что автозапуск (GitHub Actions) отработал без ошибок.`;
    } else if(staleNames.length){
      banner.style.display = '';
      banner.textContent = `Похоже, таблицу расходов давно не обновляли: ${staleNames.join(', ')}. Проверь Spend за текущую неделю.`;
    } else {
      banner.style.display = 'none';
    }

    if(!state.selectedKey){
      const keys = availableKeys();
      state.selectedKey = keys[0];
    }
    render();
  }catch(err){
    banner.style.display = '';
    banner.textContent = 'Не смог загрузить данные: ' + err.message + '. Если сборщик ещё не запускался — запусти workflow вручную в разделе Actions.';
  } finally {
    if(showSpinner) setTimeout(()=>btn.classList.remove('spinning'), 400);
  }
}

function renderPeriodValueSelect(){
  const sel = document.getElementById('periodValue');
  const keys = availableKeys();
  if(!keys.includes(state.selectedKey)) state.selectedKey = keys[0];
  if(!keys.length){
    sel.innerHTML = `<option>нет данных</option>`;
    return;
  }
  sel.innerHTML = keys.map((k,i)=>`<option value="${k}" ${k===state.selectedKey?'selected':''}>${periodLabel(k,i)}</option>`).join('');
}

function renderTabs(){
  const tabs = document.getElementById('groupTabs');
  tabs.innerHTML = '';
  Object.entries(GROUP_META).forEach(([key,meta])=>{
    const btn = document.createElement('button');
    btn.className = key===state.group ? 'active':'';
    btn.textContent = meta.title;
    btn.onclick = ()=>{ state.group=key; render(); };
    tabs.appendChild(btn);
  });
}

function renderKPIs(){
  const keys = availableKeys();
  const idx = keys.indexOf(state.selectedKey);
  const curSnap = getSnapshot(state.selectedKey);
  const prevSnap = idx >= 0 && idx+1 < keys.length ? getSnapshot(keys[idx+1]) : null;

  const cur = computeDerived(curSnap ? curSnap[state.group] : null);
  const prev = prevSnap ? computeDerived(prevSnap[state.group]) : null;
  const deltaLabel = state.periodType === 'week' ? 'к пред. неделе' : 'к пред. месяцу';

  const cards = [
    { label:'Registrations', val:fmtInt(cur.registrations), d: prev ? delta(cur.registrations, prev.registrations) : null, icon:'people', bg:'var(--accent-soft)', fg:'var(--accent)' },
    { label:'FTD', val:fmtInt(cur.ftd), d: prev ? delta(cur.ftd, prev.ftd) : null, icon:'card', bg:'var(--amber-soft)', fg:'var(--amber)' },
    { label:'GGR', val:fmtMoney(cur.ggr), d: prev ? delta(cur.ggr, prev.ggr) : null, icon:'dollar', bg:'var(--blue-soft)', fg:'var(--blue)' },
    { label:'NGR', val:fmtMoney(cur.ngr), d: prev ? delta(cur.ngr, prev.ngr) : null, icon:'bank', bg:'var(--indigo-soft)', fg:'var(--indigo)' },
    { label:'CR FTD', val:fmtPct(cur.crFtd), d: prev ? delta(cur.crFtd, prev.crFtd) : null, icon:'target', bg:'var(--accent-soft)', fg:'var(--accent)' },
    { label:'CPA FTD', val: cur.cpaFtd!=null ? '$'+cur.cpaFtd.toFixed(2) : '—', d: (prev && cur.cpaFtd!=null && prev.cpaFtd!=null) ? delta(cur.cpaFtd, prev.cpaFtd) : null, invert:true, icon:'calc', bg:'#ECECEC', fg:'var(--ink-muted)' },
  ];

  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = '';
  cards.forEach(c=>{
    let dir = '';
    if(c.d){
      const positive = c.invert ? c.d.pct < 0 : c.d.pct > 0;
      dir = positive ? 'up':'down';
    }
    const el = document.createElement('div');
    el.className = 'kpi ' + dir;
    el.innerHTML = `
      <div class="kpi-head">
        <div class="kpi-icon" style="background:${c.bg}; color:${c.fg};">${svgIcon(c.icon)}</div>
        <p class="kpi-label">${c.label}</p>
      </div>
      <p class="kpi-value">${c.val}</p>
      ${c.d ? `<div class="delta ${dir}">${svgIcon(dir==='up'?'trendUp':'trendDown')} ${Math.abs(c.d.pct).toFixed(1)}% <span class="prev">${deltaLabel}</span></div>` : `<div class="delta"><span class="prev">нет данных за пред. период</span></div>`}
    `;
    grid.appendChild(el);
  });
}

let regFtdChartRef = null;
let spendChartRef = null;
let ggrChartRef = null;

function shortPeriodLabel(key, index){
  if(state.periodType === 'week'){
    const names = ['Эта неделя','Прошлая неделя','2 нед. назад','3 нед. назад','4 нед. назад','5 нед. назад','6 нед. назад','7 нед. назад','8 нед. назад','9 нед. назад','10 нед. назад','11 нед. назад'];
    return names[index] || key;
  }
  const names = ['Этот месяц','Прошлый месяц'];
  return names[index] || key;
}

function barChartOptions(){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ position:'bottom', labels:{ font:{family:'Space Grotesk', size:11}, boxWidth:10 } } },
    scales:{
      y:{ beginAtZero:true, grid:{color:'#E2E5E0'}, ticks:{color:'#5C6B64', font:{family:'IBM Plex Mono', size:11}} },
      x:{ grid:{display:false}, ticks:{color:'#5C6B64', font:{family:'IBM Plex Mono', size:11}} }
    }
  };
}

function renderChart(){
  const meta = GROUP_META[state.group];
  const row = document.querySelector('.charts-row');
  if(!meta.hasDashboard){ row.style.display = 'none'; return; }
  row.style.display = '';

  const keys = availableKeys();
  const idx = keys.indexOf(state.selectedKey);
  const curSnap = getSnapshot(state.selectedKey);
  const prevSnap = idx >= 0 && idx+1 < keys.length ? getSnapshot(keys[idx+1]) : null;
  const cur = curSnap ? curSnap[state.group] : {registrations:0,ftd:0,ggr:0,spend:null};
  const prev = prevSnap ? prevSnap[state.group] : null;

  const curLabel = shortPeriodLabel(state.selectedKey, idx);
  const prevLabel = prevSnap ? shortPeriodLabel(keys[idx+1], idx+1) : null;

  document.getElementById('regFtdChartTitle').textContent = `Регистрации и FTD — ${meta.title}`;
  document.getElementById('spendGgrChartTitle').textContent = `Spend и GGR — ${meta.title}`;

  const datasetsFor = (curVal, prevVal) => {
    const ds = [{ label:curLabel, data:[curVal], backgroundColor:'#1F6F5C', borderRadius:4, maxBarThickness:60 }];
    if(prev) ds.push({ label:prevLabel, data:[prevVal], backgroundColor:'#B7C4BD', borderRadius:4, maxBarThickness:60 });
    return ds;
  };

  if(regFtdChartRef) regFtdChartRef.destroy();
  regFtdChartRef = new Chart(document.getElementById('regFtdChart'), {
    type:'bar',
    data:{
      labels:['Registrations','FTD'],
      datasets:[
        { label:curLabel, data:[cur.registrations, cur.ftd], backgroundColor:'#1F6F5C', borderRadius:4, maxBarThickness:70 },
        ...(prev ? [{ label:prevLabel, data:[prev.registrations, prev.ftd], backgroundColor:'#B7C4BD', borderRadius:4, maxBarThickness:70 }] : [])
      ]
    },
    options: barChartOptions(),
  });

  if(spendChartRef) spendChartRef.destroy();
  spendChartRef = new Chart(document.getElementById('spendChart'), {
    type:'bar',
    data:{ labels:['Spend'], datasets: datasetsFor(cur.spend||0, prev ? (prev.spend||0) : 0) },
    options: { ...barChartOptions(), plugins:{...barChartOptions().plugins, title:{display:true,text:'Spend ($)',font:{family:'Space Grotesk',size:12,weight:'600'},color:'var(--ink-muted)'}} },
  });

  if(ggrChartRef) ggrChartRef.destroy();
  ggrChartRef = new Chart(document.getElementById('ggrChart'), {
    type:'bar',
    data:{ labels:['GGR'], datasets: datasetsFor(cur.ggr||0, prev ? (prev.ggr||0) : 0) },
    options: { ...barChartOptions(), plugins:{...barChartOptions().plugins, title:{display:true,text:'GGR ($)',font:{family:'Space Grotesk',size:12,weight:'600'},color:'var(--ink-muted)'}} },
  });
}

function renderInsights(){
  const row = document.getElementById('insightsRow');
  const hist = (HISTORY && HISTORY[state.group]) ? HISTORY[state.group] : [];
  if(hist.length < 2){
    row.innerHTML = `<div class="insights-empty">Инсайты появятся, когда накопится история минимум за 2 запуска сборщика.</div>`;
    return;
  }
  const maxReg = hist.reduce((a,b)=> b.registrations > a.registrations ? b : a);
  const maxFtd = hist.reduce((a,b)=> b.ftd > a.ftd ? b : a);
  const first = hist[0], last = hist[hist.length-1];
  const ggrGrowth = first.ggr ? ((last.ggr-first.ggr)/first.ggr*100) : (last.ggr>0?100:0);

  const fmtDate = d => d.slice(5).split('-').reverse().join('.');

  row.innerHTML = `
    <div class="insight">
      <div class="insight-icon" style="background:var(--accent-soft); color:var(--accent);">${svgIcon('people')}</div>
      <div><p class="insight-label">Максимум регистраций</p><p class="insight-value">${fmtDate(maxReg.date)} (${fmtInt(maxReg.registrations)})</p></div>
    </div>
    <div class="insight">
      <div class="insight-icon" style="background:var(--amber-soft); color:var(--amber);">${svgIcon('star')}</div>
      <div><p class="insight-label">Пик FTD</p><p class="insight-value">${fmtDate(maxFtd.date)} (${fmtInt(maxFtd.ftd)})</p></div>
    </div>
    <div class="insight">
      <div class="insight-icon" style="background:${ggrGrowth>=0?'var(--accent-soft)':'var(--danger-soft)'}; color:${ggrGrowth>=0?'var(--accent)':'var(--danger)'};">${svgIcon(ggrGrowth>=0?'trendUp':'trendDown')}</div>
      <div><p class="insight-label">Рост GGR</p><p class="insight-value">${ggrGrowth>=0?'+':''}${ggrGrowth.toFixed(1)}% за период</p></div>
    </div>
  `;
}

function renderTable(){
  const meta = GROUP_META[state.group];
  const snap = getSnapshot(state.selectedKey);
  const rows = (snap && snap[state.group] && snap[state.group].rows) || [];

  document.getElementById('tableTitle').textContent = meta.title;
  document.getElementById('tableHint').textContent = rows.length ? `${rows.length} строк` : '';

  const table = document.getElementById('dataTable');

  if(!rows.length){
    table.innerHTML = `<tbody><tr><td style="padding:16px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace; font-size:12.5px;">Нет данных за этот период для группы «${meta.title}».</td></tr></tbody>`;
    return;
  }

  table.innerHTML = `
    <thead><tr>
      <th>Партнёр</th>
      <th class="num-h">Registrations</th><th class="num-h">FTD</th>
      <th class="num-h">GGR</th><th class="num-h">NGR</th>
      <th class="num-h">CR FTD</th><th class="num-h">Spend</th><th class="num-h">CPA FTD</th>
    </tr></thead>
    <tbody>
      ${rows.map(r=>`
        <tr>
          <td>(${r.partner_id}) ${r.partner_name}${r.offer_name ? `<span class="offer-tag">${r.offer_name}</span>` : ''}</td>
          <td class="num">${fmtInt(r.registrations)}</td>
          <td class="num">${fmtInt(r.ftd)}</td>
          <td class="num">${fmtMoney(r.ggr)}</td>
          <td class="num">${fmtMoney(r.ngr)}</td>
          <td class="num">${fmtPct(r.cr_ftd)}</td>
          <td class="num">${r.spend!=null ? (r.spend?fmtMoney(r.spend):'<span class="muted-cell">0</span>') : '<span class="muted-cell">—</span>'}</td>
          <td class="num">${r.cpa_ftd!=null ? ('$'+r.cpa_ftd.toFixed(2)) : '<span class="muted-cell">—</span>'}</td>
        </tr>
      `).join('')}
    </tbody>`;
}

function render(){
  renderPeriodValueSelect();
  renderTabs();
  renderKPIs();
  renderChart();
  renderInsights();
  renderTable();
}

document.getElementById('periodSeg').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#periodSeg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.periodType = btn.dataset.period;
  state.selectedKey = null; // подхватит первый доступный ключ нового типа в render()
  render();
});

document.getElementById('periodValue').addEventListener('change', (e)=>{
  state.selectedKey = e.target.value;
  render();
});

document.getElementById('refreshBtn').addEventListener('click', ()=> loadData(true));

loadData(false);
</script>
</body>
</html>
